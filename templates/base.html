<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CHRYSPHARMACY</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a href="{{ url_for('index') }}">✚ CHRYSPHARMACY</a><nav>{% if current_user.is_authenticated %}{% if current_user.role=='admin' %}<a href="{{ url_for('admin_dashboard') }}">Dashboard</a><a href="{{ url_for('clients') }}">Πελάτες</a>{% else %}<a href="{{ url_for('client_portal') }}">Η καρτέλα μου</a>{% endif %}<form method="post" action="{{ url_for('logout') }}" class="inline"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Αποσύνδεση</button></form>{% endif %}</nav></header><main>{% for category,msg in get_flashed_messages(with_categories=true) %}<div class="alert {{ category }}">{{ msg }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
