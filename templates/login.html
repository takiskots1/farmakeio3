{% extends 'base.html' %}{% block content %}<h1>Σύνδεση {{ 'διαχειριστή' if kind=='admin' else 'πελάτη' }}</h1><form method="post" class="panel">{{ form.hidden_tag() }}<label>{{ form.username.label }}{{ form.username() }}</label><label>{{ form.password.label }}{{ form.password() }}</label>{{ form.submit(class_='btn') }}{% for field in form %}{% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}{% endfor %}</form>{% endblock %}
