{% extends 'base.html' %}{% block content %}<h1>Επεξεργασία συνταγής #{{ item.id }}</h1><form method="post" class="panel">{{ form.hidden_tag() }}{% for field in [form.title,form.opens_on,form.notes,form.active] %}<label>{{ field.label }}{{ field() }}{% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>{% endfor %}{{ form.submit(class_='btn') }}</form>{% endblock %}
