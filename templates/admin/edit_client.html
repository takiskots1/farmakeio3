{% extends 'base.html' %}{% block content %}<h1>Επεξεργασία: {{ client.full_name }}</h1><form method="post" class="panel">{{ form.hidden_tag() }}{% for field in [form.full_name,form.amka,form.phone,form.email,form.sms_consent,form.email_consent] %}<label>{{ field.label }}{{ field() }}{% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>{% endfor %}{{ form.submit(class_='btn') }}</form>{% endblock %}
